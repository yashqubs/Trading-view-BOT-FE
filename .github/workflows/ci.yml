name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          VITE_MOCK: "false"
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Run tests
        run: pnpm test

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  deploy:
    name: Deploy to Production
    needs: build-test-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate deploy configuration
        run: |
          missing=()
          [ -z "${{ secrets.EC2_HOST }}" ] && missing+=("EC2_HOST secret")
          [ -z "${{ secrets.EC2_SSH_USER }}" ] && missing+=("EC2_SSH_USER secret")
          [ -z "${{ secrets.EC2_SSH_KEY }}" ] && missing+=("EC2_SSH_KEY secret")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions config: ${missing[*]}"
            echo "Add secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_DIR=/var/www/quantum-trade/Trading-view-BOT-FE

            # Repo may be owned by root from manual setup; deploy user needs write access.
            sudo chown -R "$(whoami):$(whoami)" "$DEPLOY_DIR"

            cd "$DEPLOY_DIR"

            git config --global --add safe.directory "$DEPLOY_DIR"

            echo "Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            pnpm install --frozen-lockfile

            echo "Building frontend..."
            VITE_MOCK=false VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" pnpm build

            echo "Reloading Nginx..."
            sudo nginx -t && sudo systemctl reload nginx

            echo "Verifying deployment..."
            if [ ! -f dist/index.html ]; then
              echo "Health check failed: dist/index.html not found after build."
              exit 1
            fi

            for i in {1..5}; do
              if curl -fsS http://127.0.0.1/index.html > /dev/null; then
                echo "Deployment successful."
                exit 0
              fi
              sleep 3
            done

            echo "Health check failed: Nginx did not serve index.html."
            exit 1