name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          VITE_MOCK: "false"

      - name: Run tests
        run: pnpm test

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  deploy:
    name: Deploy to Production
    needs: build-test-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate deploy configuration
        run: |
          missing=()
          [ -z "${{ secrets.EC2_HOST }}" ] && missing+=("EC2_HOST secret")
          [ -z "${{ secrets.EC2_SSH_USER }}" ] && missing+=("EC2_SSH_USER secret")
          [ -z "${{ secrets.EC2_SSH_KEY }}" ] && missing+=("EC2_SSH_KEY secret")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions config: ${missing[*]}"
            echo "Add secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /var/www/quantum-trade/frontend

            echo "Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            pnpm install --frozen-lockfile

            echo "Building frontend..."
            VITE_MOCK=false pnpm build

            echo "Restarting frontend..."
            pm2 restart trading_view_frontend

            pm2 save

            echo "Waiting for application..."
            sleep 10

            echo "Running health check..."

            for i in {1..5}; do
              if curl -fsS http://127.0.0.1:5173 > /dev/null; then
                echo "Deployment successful."
                exit 0
              fi

              sleep 3
            done

            echo "Health check failed."
            exit 1