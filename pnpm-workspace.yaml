allowBuilds:
  msw: true

# Transitive security overrides — the single source of truth for them.
#
# This file is the only place pnpm reads overrides from: it ignores
# package.json's top-level `overrides`, and since v11 the `pnpm.overrides`
# key too (it warns and carries on). CI runs `pnpm audit` against
# pnpm-lock.yaml, so an entry here is both what fixes the shipped tree and
# what makes CI go green — there is no second list to keep in sync.
#
# Pin a direct dependency by bumping its range in package.json instead;
# overrides are for transitive ones you cannot reach directly.
overrides:
  # Reached through socket.io-client, which is already on its current ^4.8.3
  # and still resolves the vulnerable parser — so bumping the direct dependency
  # does not fix it.
  socket.io-parser: '>=4.2.7'
